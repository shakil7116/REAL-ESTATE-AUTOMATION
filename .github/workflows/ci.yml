name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── 1. Web: typecheck, lint, test, build ─────────────────────────
  web:
    name: Web (${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: propertyease

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: propertyease/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # No real credentials here — Prisma only needs *something* parseable
          # as a Postgres URL to resolve the `env("DATABASE_URL")` in schema.prisma.
          DATABASE_URL: 'postgresql://stub@localhost:5432/stub?schema=public'

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://stub.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'stub-anon-key'
          NEXTAUTH_SECRET: 'stub-secret-for-ci'
          NEXTAUTH_URL: 'http://localhost:3000'

      - name: Build (source maps uploaded by Sentry SDK)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://stub.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'stub-anon-key'
          NEXTAUTH_SECRET: 'stub-secret-for-ci'
          NEXTAUTH_URL: 'http://localhost:3000'
          # Sentry — skipped in CI but config is present for local Prod builds
          SENTRY_DSN: '${{ secrets.SENTRY_DSN }}'
          SENTRY_ORG: '${{ secrets.SENTRY_ORG }}'
          SENTRY_PROJECT: '${{ secrets.SENTRY_PROJECT }}'
          # Vercel injects VERCEL_GIT_COMMIT_SHA automatically; stub for CI typecheck
          VERCEL_GIT_COMMIT_SHA: '${{ github.sha }}'
          NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: '${{ github.sha }}'

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          directory: propertyease/coverage
          fail_ci_if_error: false

  # ── 2. Mobile: typecheck, lint, test ─────────────────────────────
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: propertyease-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: propertyease-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci
        env:
          EXPO_PUBLIC_SUPABASE_URL: 'https://stub.supabase.co'
          EXPO_PUBLIC_SUPABASE_ANON_KEY: 'stub-anon-key'

  # ── 3. AI-OS contract checks ────────────────────────────────────
  contracts:
    name: AI-OS contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate eval case JSON
        run: |
          for f in evals/cases/*.json; do
            echo "Validating $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf-8'))"
          done

      - name: Validate MCP registry
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.mcp.json', 'utf-8'))"
          echo "✓ .mcp.json is valid JSON"

      - name: Validate Claude settings
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude/settings.json', 'utf-8'))"
          echo "✓ .claude/settings.json is valid JSON"

      - name: Check i18n parity
        run: |
          node -e "
          const fs = require('fs');
          const t = fs.readFileSync('propertyease/src/lib/i18n.ts', 'utf-8');
          const en = (t.match(/en:\s*{([\s\S]*?)},\s*ar:/m) || [])[1] || '';
          const ar = (t.match(/ar:\s*{([\s\S]*?)},\s*}\s*as const/m) || [])[1] || '';
          const keys = (s) => new Set([...s.matchAll(/^\s*([a-zA-Z]\w*)\s*:/gm)].map(m => m[1]));
          const enKeys = keys(en);
          const arKeys = keys(ar);
          const missingInAr = [...enKeys].filter(k => !arKeys.has(k));
          const missingInEn = [...arKeys].filter(k => !enKeys.has(k));
          if (missingInAr.length || missingInEn.length) {
            console.error('i18n mismatch:');
            missingInAr.forEach(k => console.error('  in EN, missing in AR:', k));
            missingInEn.forEach(k => console.error('  in AR, missing in EN:', k));
            process.exit(1);
          }
          console.log('✓ i18n parity OK (' + enKeys.size + ' keys)');
          "

      - name: Check for committed secrets
        run: |
          echo "Scanning for secrets..."
          PATTERNS=(
            'sk-[a-zA-Z0-9_-]{20,}'
            'sk_nry_[a-zA-Z0-9_-]{20,}'
            'AIza[a-zA-Z0-9_-]{30,}'
            'ghp_[a-zA-Z0-9]{30,}'
          )
          FAIL=0
          for p in "${PATTERNS[@]}"; do
            if grep -rE -l --exclude-dir=node_modules --exclude-dir=.git "$p" . ; then
              echo "❌ Secret pattern found: $p"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "🛑 Secrets detected. Aborting."
            exit 1
          fi
          echo "✓ No secrets found"

  # ── 4. Eval harness (engine quality) ────────────────────────────
  evals:
    name: LLM evals
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run eval harness (stub mode)
        run: |
          PE_EVAL_STUB=1 npx tsx evals/runner.ts
          echo ""
          echo "ℹ️  Evals ran in stub mode in CI (no real LLM key in CI env)."
          echo "   Set OPENAI_API_KEY in GitHub Secrets to enable real eval runs."

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results.json

  # ── 5. Required checks summary ──────────────────────────────────
  all-green:
    name: All checks green
    runs-on: ubuntu-latest
    needs: [web, mobile, contracts, evals]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.web.result }}" != "success" ] || \
             [ "${{ needs.mobile.result }}" != "success" ] || \
             [ "${{ needs.contracts.result }}" != "success" ] || \
             [ "${{ needs.evals.result }}" != "success" ]; then
            echo "❌ One or more jobs failed:"
            echo "  web:      ${{ needs.web.result }}"
            echo "  mobile:   ${{ needs.mobile.result }}"
            echo "  contracts:${{ needs.contracts.result }}"
            echo "  evals:    ${{ needs.evals.result }}"
            exit 1
          fi
          echo "✅ All checks passed."
